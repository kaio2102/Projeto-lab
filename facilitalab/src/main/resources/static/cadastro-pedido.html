<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Pedido – Facilita Lab</title>

    <!-- Estilos globais (variáveis, sidebar, layout, .btn-primary) -->
    <link rel="stylesheet" href="/css/layout.css" />
    <!-- Estilos específicos desta tela (grid, campos, upload, toast) -->
    <link rel="stylesheet" href="/css/cadastro-pedido.css" />
</head>

<body>
    <div class="app">
        <!-- Sidebar carregada dinamicamente por sidebar.js -->
        <div id="sidebar-container"></div>

        <main class="content">
            <!-- ── Cabeçalho da página ─────────────────────────────────── -->
            <div class="page-header">
                <a href="/lista-pedidos" class="btn-voltar">
                    <span class="btn-voltar-seta">&#8592;</span> Voltar para a lista
                </a>
                <h1>Novo Pedido</h1>
                <span class="page-sub">Preencha os dados para cadastrar um novo pedido</span>
            </div>

            <!-- ── Grid 2 colunas: Formulário + Painel auxiliar ────────── -->
            <div class="cadastro-grid">

                <!-- ── COLUNA ESQUERDA — Formulário ────────────────────── -->
                <div class="card">

                    <!-- Campo: Cor / Shade -->
                    <div class="field">
                        <label for="cor">Cor / Shade <span class="obrigatorio">*</span></label>
                        <input type="text" id="cor" placeholder="Ex: A2, Branco, OM3" maxlength="50" />
                        <span class="field-error"></span>
                    </div>

                    <!-- Campo: Tipo de Prótese (enum do backend) -->
                    <div class="field">
                        <label for="tipoProtese">Tipo de Prótese <span class="obrigatorio">*</span></label>
                        <select id="tipoProtese">
                            <option value="">Selecione...</option>
                            <option value="COROA">Coroa</option>
                            <option value="PONTE">Ponte</option>
                            <option value="IMPLANTE">Implante</option>
                            <option value="PROVISORIO">Provisório</option>
                            <option value="FACETA">Faceta</option>
                            <option value="INLAY">Inlay</option>
                        </select>
                        <span class="field-error"></span>
                    </div>

                    <!-- Campo: Material (enum do backend) -->
                    <div class="field">
                        <label for="material">Material <span class="obrigatorio">*</span></label>
                        <select id="material">
                            <option value="">Selecione...</option>
                            <option value="ZIRCONIA">Zircônia</option>
                            <option value="RESINA">Resina</option>
                            <option value="METAL">Metal</option>
                            <option value="CERAMICA">Cerâmica</option>
                        </select>
                        <span class="field-error"></span>
                    </div>

                    <!-- Campo: Prioridade (enum do backend) -->
                    <div class="field">
                        <label for="prioridade">Prioridade <span class="obrigatorio">*</span></label>
                        <select id="prioridade">
                            <option value="">Selecione...</option>
                            <option value="URGENTE">Urgente</option>
                            <option value="NORMAL">Normal</option>
                        </select>
                        <span class="field-error"></span>
                    </div>

                    <!-- Campo: Prazo de Entrega (date, mín = amanhã via JS) -->
                    <div class="field">
                        <label for="prazoEntrega">Prazo de Entrega <span class="obrigatorio">*</span></label>
                        <input type="date" id="prazoEntrega" />
                        <span class="field-error"></span>
                    </div>

                    <!-- Campo: Observações (opcional) -->
                    <div class="field">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" placeholder="Observações adicionais (opcional)"
                            maxlength="500" rows="4"></textarea>
                        <span class="field-error"></span>
                    </div>
                </div>

                <!-- ── COLUNA DIREITA — Upload + Checklist + Enviar ────── -->
                <div class="side-column">

                    <!-- Upload STL (Prova de Conceito — visual apenas) -->
                    <div class="card">
                        <div class="card__title">📎 Arquivo STL</div>
                        <div class="upload-zone" id="stl-upload-zone">
                            <div class="upload-zone__icon">🦷</div>
                            <div class="upload-zone__text">Clique para enviar o STL</div>
                            <div class="upload-zone__sub">Formatos: .stl · .ply · .obj</div>
                        </div>
                    </div>

                    <!-- Checklist estático de verificação -->
                    <div class="card">
                        <div class="card__title">🔍 Checklist</div>
                        <div class="checklist">
                            <label><input type="checkbox" checked /> Scan completo</label>
                            <label><input type="checkbox" checked /> Antagonistas</label>
                            <label><input type="checkbox" checked /> Shade definida</label>
                            <label><input type="checkbox" checked /> Prazo acordado</label>
                        </div>
                    </div>

                    <!-- Botão de envio (conectado por JS, sem onclick inline) -->
                    <button id="btnEnviar" class="btn-primary">Enviar para Triagem</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts carregados no final do body para garantir que o DOM existe -->
    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/cadastro-pedido.js"></script>
</body>

</html>
