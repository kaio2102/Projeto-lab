<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários – Facilita Lab</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/lista.css" />
    <link rel="stylesheet" href="/css/cadastro.css" />
</head>

<body>
<div class="app">
    <div id="sidebar-container"></div>

    <main class="content">
        <div class="page-header">
            <div class="page-header-row">
                <div>
                    <h1>Usuários</h1>
                    <span class="page-sub">Gerencie os usuários do sistema</span>
                </div>

                <button type="button" class="btn btn-primary btn-novo" onclick="abrirModalCadastro()">
                    <i class="bi bi-plus-lg"></i> Cadastrar Usuário
                </button>
            </div>
        </div>

        <div class="filtros">
            <button class="filtro-btn active" data-perfil="">Todos</button>
            <button class="filtro-btn" data-perfil="GESTOR">Gestor</button>
            <button class="filtro-btn" data-perfil="RECEPCAO">Recepção</button>
            <button class="filtro-btn" data-perfil="CADISTA">Cadista</button>
            <button class="filtro-btn" data-perfil="DENTISTA">Dentista</button>
        </div>

        <div class="table-card">
            <table id="tabela">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Perfil</th>
                    <th>Cadastrado em</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="corpo"></tbody>
            </table>
            <p id="vazio" style="display:none">Nenhum usuário encontrado.</p>
        </div>
    </main>
</div>

<!-- Modal: Cadastro de usuário -->
<div class="modal fade" id="modalCadastroUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Novo Usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body" id="modalCadastroUsuarioBody"></div>
        </div>
    </div>
</div>

<!-- Modal: Edição de usuário -->
<div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body" id="modalEditarUsuarioBody"></div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/masks.js"></script>
<script src="/js/cadastro-usuario.js"></script>
<script src="/js/editar-usuario.js"></script>
<script src="/js/lista-usuario.js"></script>
</body>

</html>
