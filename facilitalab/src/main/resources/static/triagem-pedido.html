<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triagem de Pedidos – Facilita Lab</title>

    <!-- Estilos globais (variáveis, sidebar, layout, .btn-primary) -->
    <link rel="stylesheet" href="/css/layout.css" />
    <!-- Estilos específicos da triagem (tabela, modal, empty state) -->
    <link rel="stylesheet" href="/css/triagem.css" />
</head>

<body>
    <div class="app">
        <!-- Sidebar carregada dinamicamente por sidebar.js -->
        <div id="sidebar-container"></div>

        <main class="content">
            <!-- ── Cabeçalho da página ─────────────────────────────────── -->
            <div class="page-header">
                <h1>Triagem de Pedidos</h1>
                <span class="page-sub">Pedidos aguardando validação antes de seguir para análise</span>
            </div>

            <!-- ── Card principal com a tabela de triagem ──────────────── -->
            <div class="table-card">
                <table id="tabela-triagem">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Material</th>
                            <th>Prioridade</th>
                            <th>Prazo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-triagem"></tbody>
                </table>

                <!-- Empty state — exibido quando não há pedidos -->
                <div id="vazio-triagem" class="empty-state" style="display:none">
                    <div class="empty-state__icon">📋</div>
                    <p class="empty-state__text">Nenhum pedido aguardando triagem</p>
                    <p class="empty-state__sub">Quando novos pedidos chegarem, eles aparecerão aqui.</p>
                </div>
            </div>
        </main>
    </div>

    <!-- ── Modal de devolução ─────────────────────────────────────────── -->
    <!-- Aparece ao clicar "Devolver" — exige motivo antes de confirmar.  -->
    <div id="modal-devolucao" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal__header">
                <h2 class="modal__title">Devolver Pedido</h2>
                <button class="modal__close" id="btnFecharModal">&times;</button>
            </div>

            <!-- como a PoC é hoje dia 18 eu resolvi tirar isso para n ter q implementar nada do bak em cima da hora -->
            <!-- <div class="modal__body">
                <div class="field">
                    <label for="motivoDevolucao">Motivo da devolução <span class="obrigatorio">*</span></label>
                    <textarea id="motivoDevolucao" rows="4"
                        placeholder="Descreva o motivo da devolução..." maxlength="500"></textarea>
                    <span class="field-error" id="erroMotivo"></span>
                </div>
            </div>
            <div class="modal__footer">
                <button class="btn-secondary" id="btnCancelarModal">Cancelar</button>
                <button class="btn-primary btn-confirmar" id="btnConfirmarDevolucao">Confirmar Devolução</button>
            </div>
            -->
        </div>
    </div>

    <!-- Scripts carregados no final do body para garantir que o DOM existe -->
    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/triagem.js"></script>
</body>

</html>
