<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha – Facilita Lab</title>
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/login.css" />
</head>

<body>

<!-- ═══════════════════════════════════════
     TELA DE REDEFINIÇÃO DE SENHA
═══════════════════════════════════════ -->
<div class="login-wrapper">
    <div class="login-card">

        <div class="login-brand">
            <div class="login-brand-icon">
                <svg viewBox="0 0 82 90" fill="none" xmlns="http://www.w3.org/2000/svg" width="30" height="33">
                    <path d="M26 8C20 8 13 13.5 13 22C13 27.5 14 33 16 39.5C18.5 48.5 20 59 25.5 68C27 72 29.5 74 33 73C36 72 36.5 67.5 37.5 62.5C38.5 58 40 56 42 56C44 56 45.5 58 46.5 62.5C47.5 67.5 48 72 51 73C54.5 74 57 72 58.5 68C64 59 65.5 48.5 68 39.5C70 33 71 27.5 71 22C71 13.5 64 8 58 8C54 8 50 10.5 42 10.5C34 10.5 30 8 26 8Z"
                        fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Redefinir <span class="brand-name">senha</span></h1>
            <p>Crie uma nova senha para sua conta</p>
        </div>

        <div class="login-fields">
            <div class="login-field">
                <label for="novaSenha">Nova senha</label>
                <input type="password" id="novaSenha" placeholder="Digite a nova senha" />
            </div>

            <div class="login-field">
                <label for="confirmarSenha">Confirmar nova senha</label>
                <input type="password" id="confirmarSenha" placeholder="Repita a nova senha" />
            </div>

            <button id="btnRedefinir" class="btn-primary" onclick="redefinirSenha()">Redefinir senha</button>

        </div>
        <div id="mensagem"></div>

        <a href="/login" class="btn-voltar">
            <span class="btn-voltar-seta">&#8249;</span> Voltar ao login
        </a>

    </div>
</div>

<script src="/js/redefinir-senha.js"></script>
</body>

</html>
