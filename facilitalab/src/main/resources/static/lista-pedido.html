<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pedidos – Facilita Lab</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css"/>
    <link rel="stylesheet" href="/css/layout.css"/>
    <link rel="stylesheet" href="/css/lista.css"/>
    <link rel="stylesheet" href="/css/cadastro-pedido.css"/>
</head>

<body>
<div class="app">
    <div id="sidebar-container"></div>

    <main class="content">
        <div class="page-header">
            <div class="page-header-row">
                <div>
                    <h1>Pedidos</h1>
                    <span class="page-sub">Gerencie os pedidos do laboratório</span>
                </div>

                <button type="button" class="btn btn-primary btn-novo" onclick="abrirModalCadastroPedido()">
                    <i class="bi bi-plus-lg"></i> Cadastrar Pedido
                </button>
            </div>
        </div>

        <div class="filtros">
            <button class="filtro-btn active" data-estado="">Todos</button>
            <button class="filtro-btn" data-estado="AGUARDANDO_TRIAGEM">Aguardando Triagem</button>
            <button class="filtro-btn" data-estado="EM_ANALISE">Em Análise</button>
            <button class="filtro-btn" data-estado="EM_MODELAGEM">Em Modelagem</button>
            <button class="filtro-btn" data-estado="FINALIZADO">Finalizado</button>
            <button class="filtro-btn" data-estado="CANCELADO">Cancelado</button>
        </div>

        <div class="table-card">
            <table id="tabela">
                <thead>
                <tr>
                    <th>Tipo de Prótese</th>
                    <th>Cor</th>
                    <th>Material</th>
                    <th>Dentista</th>
                    <th>Prioridade</th>
                    <th>Estado</th>
                    <th>Prazo de Entrega</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="corpo"></tbody>
            </table>
            <p id="vazio" style="display:none">Nenhum pedido encontrado.</p>
        </div>
    </main>
</div>

<!-- Toasts de feedback — compartilhados pelos dois modais -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080">
    <div id="toastErroPedido" class="toast toast-erro align-items-center border-0" role="alert" aria-live="assertive"
         aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastErroPedidoBody"></div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
    <div id="toastSucessoPedido" class="toast toast-sucesso align-items-center border-0" role="alert"
         aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastSucessoPedidoBody"></div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
</div>

<!-- Modal: Cadastro de pedido -->
<div class="modal fade" id="modalCadastroPedido" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Novo Pedido</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body" id="modalCadastroPedidoBody"></div>
        </div>
    </div>
</div>

<!-- Modal: Edição de pedido -->
<div class="modal fade" id="modalEditarPedido" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Pedido</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body" id="modalEditarPedidoBody"></div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/cadastro-pedido.js"></script>
<script src="/js/editar-pedido.js"></script>
<script src="/js/lista-pedido.js"></script>
</body>

</html>
